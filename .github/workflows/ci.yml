name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Content validation runs here: unknown authors, broken internal links and
      # missing ownership disclosures fail this step.
      - run: pnpm build

      - name: Disclosure and compliance audit
        run: pnpm audit:disclosure
